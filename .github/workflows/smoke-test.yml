name: Smoke Test (simulator launch)

on:
  push:
    paths:
      - ".github/workflows/smoke-test.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-15

    env:
      PROJECT: DulaTrackProClone.xcodeproj
      TARGET: DulaTrackProClone
      BUNDLE_ID: com.dula.trackpro.clone

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Build for simulator
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$TARGET" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot simulator and launch app
        id: launch
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          best=''
          for runtime,devs in d.items():
              if 'iOS-26' in runtime:
                  for dev in devs:
                      if dev['name'].startswith('iPhone'):
                          best=dev['udid']; break
              if best: break
          if not best:
              for runtime,devs in d.items():
                  for dev in devs:
                      if dev['name'].startswith('iPhone'):
                          best=dev['udid']; break
                  if best: break
          print(best)
          ")
          echo "Device: $DEVICE"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

          xcrun simctl boot "$DEVICE" > boot.log 2>&1 &
          BOOT_PID=$!
          for i in $(seq 1 40); do
            if xcrun simctl list devices | grep "$DEVICE" | grep -q "Booted"; then
              echo "Booted after $((i*3))s"; break
            fi
            sleep 3
          done
          kill $BOOT_PID 2>/dev/null || true
          cat boot.log || true

          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          perl -e 'alarm shift; exec @ARGV' 120 xcrun simctl install "$DEVICE" "$APP" || echo "INSTALL_FAILED"
          perl -e 'alarm shift; exec @ARGV' 60 xcrun simctl launch "$DEVICE" "$BUNDLE_ID" || echo "LAUNCH_FAILED"
          sleep 10

          echo "=== crash reports (last 3 min) ==="
          find ~/Library/Logs/DiagnosticReports -name "DulaTrackProClone*" -newermt "-3 minutes" -print || true


      - name: Collect logs and crash reports
        if: always()
        run: |
          mkdir -p smoke-logs
          perl -e 'alarm shift; exec @ARGV' 180 xcrun simctl spawn "$DEVICE" log show --style compact --last 3m \
            --predicate 'process == "DulaTrackProClone" OR eventMessage CONTAINS "DulaTrackProClone"' \
            > smoke-logs/app.log 2>&1 || true
          cp ~/Library/Logs/DiagnosticReports/DulaTrackProClone*.ips smoke-logs/ 2>/dev/null || true
          echo "=== crash reports ==="
          ls -lt smoke-logs/*.ips 2>/dev/null | head -5 || echo "no crash report"
          for f in $(ls -t smoke-logs/*.ips 2>/dev/null | head -1); do
            echo "===== $f ====="
            head -200 "$f"
          done || true
          echo "=== app log tail ==="
          tail -80 smoke-logs/app.log || true

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: smoke-logs/
          if-no-files-found: warn
