name: Build DTPUnlock.dylib

on:
  push:
    branches: [ main ]
    paths:
      - "dylib/**"
      - ".github/workflows/build-dylib.yml"
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build arm64 iOS dylib
        working-directory: dylib
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify output
        working-directory: dylib
        run: |
          lipo -info DTPUnlock.dylib
          codesign -dv --verbose=2 DTPUnlock.dylib
          file DTPUnlock.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DTPUnlock-dylib
          path: dylib/DTPUnlock.dylib
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dylib/DTPUnlock.dylib
